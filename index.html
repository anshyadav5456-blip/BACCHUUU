<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Gunjan ✨</title>
  
  <!-- Tailwind CSS & Animation Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    .floating-element { animation: float 4s ease-in-out infinite; }
    
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4 font-sans overflow-x-hidden relative">

  <!-- Ambient Stars Background Layer -->
  <div class="fixed inset-0 pointer-events-none opacity-50 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-purple-900/40 via-slate-950 to-slate-950"></div>

  <!-- Header Section -->
  <div class="relative z-10 text-center mb-6 space-y-1">
    <span class="text-xs uppercase tracking-widest text-pink-400 font-semibold">Interactive Universe</span>
    <h1 class="text-3xl font-extrabold bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-400 bg-clip-text text-transparent">
      For Gunjan ✨
    </h1>
  </div>

  <!-- 3D Tilt Card (Polaroid / Scrapbook Vibe) -->
  <div class="relative z-10 max-w-sm w-full floating-element">
    <div data-tilt data-tilt-max="10" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.2" class="glass-card rounded-3xl p-6 shadow-2xl space-y-6 text-center border border-pink-500/20">
      
      <!-- Card Decorative Header -->
      <div class="flex justify-between items-center text-xs text-slate-400 border-b border-slate-800 pb-3">
        <span>📖 Scrapbook Note</span>
        <span id="step-count" class="text-pink-400 font-bold">1 / 4</span>
      </div>

      <!-- Main Shayari Content Box -->
      <div class="min-h-[120px] flex items-center justify-center">
        <p id="card-text" class="text-slate-200 text-base leading-relaxed italic transition-all duration-300">
          Chura kar noor tumse,<br>chand apni shaam sajata hai, 🌙✨
        </p>
      </div>

      <!-- Action Button -->
      <button id="action-btn" onclick="nextCard()" class="w-full py-3.5 px-6 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 rounded-xl font-medium shadow-lg shadow-pink-500/20 active:scale-95 transition-all text-sm tracking-wide">
        Next Line ✨
      </button>

    </div>
  </div>

  <!-- Footer Tag -->
  <p class="relative z-10 text-xs text-slate-500 mt-8">Tap to flip through the notes ❤️</p>

  <script>
    // Tumhari Image Waali Shayari Lines
    const shayari = [
      "Chura kar noor tumse,<br>chand apni shaam sajata hai, 🌙✨",
      "Tumhe dekhe toh hooro ka<br>bhi dil ghabrata hai. 💖",
      "Phiki hai raunaq-e-mahfil<br>tumhaari ek jhalak ke aage, 💫",
      "Tumhaare aage jannat ka,<br>har ek manzar sharmata hai. 🌸✨"
    ];

    let currentIndex = 0;

    function nextCard() {
      const textElem = document.getElementById('card-text');
      const btnElem = document.getElementById('action-btn');
      const countElem = document.getElementById('step-count');

      currentIndex++;

      if (currentIndex < shayari.length) {
        // Smooth Fade Out / Fade In Effect
        textElem.style.opacity = '0';
        textElem.style.transform = 'translateY(5px)';

        setTimeout(() => {
          textElem.innerHTML = shayari[currentIndex];
          countElem.innerText = `${currentIndex + 1} / ${shayari.length}`;
          textElem.style.opacity = '1';
          textElem.style.transform = 'translateY(0px)';

          if (currentIndex === shayari.length - 1) {
            btnElem.innerText = "Unfold Final Heart 🎉";
          }
        }, 200);

      } else {
        // Grand Celebration Confetti Burst
        confetti({
          particleCount: 160,
          spread: 80,
          origin: { y: 0.6 }
        });

        textElem.style.opacity = '0';
        setTimeout(() => {
          textElem.innerHTML = "<span class='text-lg font-bold not-italic bg-gradient-to-r from-pink-400 to-purple-300 bg-clip-text text-transparent'>✨ Always & Forever ✨</span>";
          countElem.innerText = "❤️";
          btnElem.innerText = "Read Again 🔄";
          textElem.style.opacity = '1';
          currentIndex = -1; // Reset loop
        }, 200);
      }
    }

    // Initialize 3D Tilt Effect
    VanillaTilt.init(document.querySelector("[data-tilt]"));
  </script>
</body>
</html>
